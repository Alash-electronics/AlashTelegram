sentence=Easy Telegram bot for ESP32 and ESP8266: receive commands, send messages and inline buttons, only your own chat, clear errors. No ArduinoJson.
paragraph=Turns an ESP32 or ESP8266 into a Telegram bot: bot.onMessage() receives commands and button presses, bot.send() and bot.sendButtons() answer with text and inline buttons, bot.allowChat() accepts commands only from your own chat so strangers cannot control your lamp, and 64-bit chat ids and Cyrillic text work correctly. Explains token, Wi-Fi and blocked-network problems in Russian, Kazakh or English. Needs only WiFiClientSecure, no ArduinoJson. Examples included, made for classes and kits by Alash Electronics.
